[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  # Node 20 receives no security fixes; the patched 22 LTS, as on the other Foxes sites (30 Oct 2026).
  NODE_VERSION = "22.23.4"
  # These NEXT_PUBLIC_* values are public by design — Next.js inlines them into the
  # client bundle (Algolia browser search uses a search-only key). Netlify secrets
  # scanning otherwise fails the build on finding them in the output. The real
  # secret (ALGOLIA_ADMIN_API_KEY, unprefixed) is intentionally NOT omitted.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_ALGOLIA_APP_ID,NEXT_PUBLIC_ALGOLIA_INDEX_NAME,NEXT_PUBLIC_ALGOLIA_SEARCH_API_KEY,NEXT_PUBLIC_SHOW_COMING_SOON"
